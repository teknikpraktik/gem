name: NAV publication observer

# OBSERVATION ONLY (approved by the repo owner 2026-10-31). Measures when Avanza
# fund NAVs are actually published around month ends, to calibrate the live
# cron window and STALE_DATA threshold. Never computes or publishes a signal,
# never trades.
#
# Volume: 6 runs/day on days 28-31 and 1-5 (~10 days/month) x 5 instruments
# = ~300 small JSON requests per month, 1 s apart.
# Results are committed to the separate branch `ci/nav-observer` (never to the
# code branches): nav_observer/observations.csv + first_seen.csv.
# Scheduled workflows run from the repository's DEFAULT branch.

on:
  schedule:
    - cron: "17 5,8,11,14,17,20 28-31,1-5 * *"   # UTC; ~07-22 Stockholm
  workflow_dispatch: {}

permissions:
  contents: write   # push observations to ci/nav-observer only

concurrency:
  group: nav-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/pyproject.toml

      - name: Install
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check out observation branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin ci/nav-observer >/dev/null; then
            git fetch --depth=1 origin ci/nav-observer
            git worktree add obs FETCH_HEAD
          else
            git worktree add --detach obs
            git -C obs checkout --orphan ci/nav-observer-new
            git -C obs rm -rq --cached . || true
            find obs -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Observe
        working-directory: research
        run: python -m gem.navobserver ../obs/nav_observer

      - name: Commit observations
        shell: bash
        run: |
          set -euo pipefail
          cd obs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nav_observer
          git commit -qm "nav-observer: $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do
            if git push origin HEAD:refs/heads/ci/nav-observer; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase origin ci/nav-observer || true
          done
          exit 1
