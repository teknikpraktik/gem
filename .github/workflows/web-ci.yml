name: Web CI

on:
  pull_request:
    paths: ["web/**", "research/src/gem/**", "research/scripts/differential_cases.py", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5   # Python reference for the differential test
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/pyproject.toml
      - run: pip install -e ../research
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          PYTHON: python
      - run: npm run build
