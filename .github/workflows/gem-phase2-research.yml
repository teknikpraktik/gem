name: GEM phase 2 research

# Research / CI runtime for the GEM research engine (NOT the future live app).
# Runs on a GitHub-hosted runner, which - unlike the Claude cloud sandbox - can reach
# FRED, the Riksbank SWEA API and the Kenneth French Data Library.
#
# Triggers:
#   * workflow_dispatch  - manual start from the Actions tab.
#   * push touching ONLY research/.run-request - lets an agent without Actions-API
#     access request a run by committing that file. Ordinary pushes never trigger it.

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit generated reports back to the branch"
        type: boolean
        default: true
  push:
    paths:
      - "research/.run-request"

permissions:
  contents: write   # only needed to commit reports back; nothing else is granted

concurrency:
  group: gem-phase2-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research
    env:
      PYTHONUNBUFFERED: "1"
      # Optional: higher Riksbank rate limits. Set in Settings > Secrets > Actions if needed.
      RIKSBANK_API_KEY: ${{ secrets.RIKSBANK_API_KEY }}
      # Optional: free FRED API key (https://fred.stlouisfed.org/docs/api/api_key.html).
      # fredgraph.csv times out from GitHub-hosted runners; with this secret the engine
      # uses the official api.stlouisfed.org endpoint instead. Never printed (redacted).
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/pyproject.toml

      - name: Connectivity (real provider endpoints)
        id: connectivity
        shell: bash
        run: |
          set +e
          mkdir -p reports/generated
          out=reports/generated/connectivity.md
          echo "# Connectivity from GitHub-hosted runner" > $out
          echo "" >> $out
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" >> $out
          echo "" >> $out
          echo "| source | url | http | bytes | seconds |" >> $out
          echo "|---|---|---:|---:|---:|" >> $out
          check() {
            local name="$1" url="$2"
            res=$(curl -sS -L --max-time 60 -A "gem-research/0.1" -o /tmp/probe -w "%{http_code} %{size_download} %{time_total}" "$url" 2>/tmp/err)
            code=$(echo "$res" | cut -d' ' -f1); size=$(echo "$res" | cut -d' ' -f2); t=$(echo "$res" | cut -d' ' -f3)
            echo "$name: HTTP $code ($size bytes) $url $(cat /tmp/err)"
            echo "| $name | $url | $code | $size | $t |" >> $out
          }
          check FRED_HOME       "https://fred.stlouisfed.org/"
          check FRED_OMRX       "https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQOMRXTBILL"
          check FRED_API_NOKEY  "https://api.stlouisfed.org/fred/series?series_id=DTB3&file_type=json"
          echo "| FRED_API_KEY secret | configured: $([ -n "$FRED_API_KEY" ] && echo yes || echo no) | | | |" >> $out
          check RIKSBANK_HOME   "https://api.riksbank.se/swea/v1/Series"
          check RIKSBANK_SSVX3M "https://api.riksbank.se/swea/v1/Observations/SETB3MBENCH/2024-01-01/2024-01-31"
          check KEN_FRENCH_HOME "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html"
          check KEN_FRENCH_FF3  "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_CSV.zip"
          cat $out >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" arch

      - name: Tests
        run: |
          set -o pipefail
          mkdir -p reports/generated
          python -m pytest -q -rs --junitxml=reports/generated/pytest.xml 2>&1 | tee reports/generated/pytest.txt
          tail -1 reports/generated/pytest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: NAV source probe (Avanza funds; responses stored for parser development)
        continue-on-error: true
        run: python -m gem.navprobe | tee reports/generated/nav_probe.log

      - name: "Run 1: refresh from sources"
        run: |
          set -o pipefail
          python -m gem.research --refresh 2>&1 | tee reports/generated/run1_refresh.log
          cp reports/generated/checksums.sha256 /tmp/checksums_run1.sha256
          sha256sum reports/generated/summary.csv reports/generated/phase2_results.json

      - name: "Run 2: from cache only"
        run: |
          set -o pipefail
          python -m gem.research --offline 2>&1 | tee reports/generated/run2_cache.log
          sha256sum reports/generated/summary.csv reports/generated/phase2_results.json

      - name: Reproducibility check
        shell: bash
        run: |
          out=reports/generated/reproducibility.md
          {
            echo "# Reproducibility (refresh run vs cache run)"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "- result files covered: $(wc -l < reports/generated/checksums.sha256)"
            echo "- summary.csv: $(sha256sum reports/generated/summary.csv | cut -c1-64)"
            echo "- phase2_results.json: $(sha256sum reports/generated/phase2_results.json | cut -c1-64)"
          } > $out
          if diff -u /tmp/checksums_run1.sha256 reports/generated/checksums.sha256 > /tmp/ckdiff; then
            echo "- **IDENTICAL**: every result file has the same sha256 in both runs" >> $out
          else
            echo "- **DIFFERENT**:" >> $out; echo '```' >> $out; head -50 /tmp/ckdiff >> $out; echo '```' >> $out
          fi
          cat $out >> "$GITHUB_STEP_SUMMARY"
          sed -n '/## 1. Source access/,/Failed endpoints/p' reports/generated/phase2.md >> "$GITHUB_STEP_SUMMARY"
          grep -q IDENTICAL $out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-phase2-results
          retention-days: 30
          path: |
            research/reports/
            research/data/manifests/
          if-no-files-found: warn

      - name: Commit reports back to the branch
        if: success() && (github.event_name == 'push' || inputs.commit_results)
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/reports research/data/manifests
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research: run phase 2 on primary data" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5))
          done
          exit 1

      - name: Push diagnostics on failure (separate branch, never the working branch)
        if: failure()
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/gem-phase2-diagnostics
          git add -f research/reports/generated/*.md research/reports/generated/*.log research/reports/generated/*.txt \
                     research/reports/generated/*.json research/reports/generated/raw_samples 2>/dev/null || true
          git commit -m "ci: phase 2 diagnostics (failed run)" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
          git push -f origin ci/gem-phase2-diagnostics
