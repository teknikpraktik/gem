# Data catalog - every series the research engine may use.
#
# No series may be used unless it is listed here. Fields:
#   quality_status : VERIFIED | PROXY | EXPERIMENTAL | UNUSABLE | LICENSE_RESTRICTED
#   verification   : VERIFIED FROM PRIMARY SOURCE | VERIFIED FROM SECONDARY SOURCE |
#                    ASSUMPTION | UNRESOLVED   (applies to the metadata in this entry)
#   build_env      : REACHABLE | BLOCKED  - whether the host could be reached from the
#                    environment this catalog was built in (2026-10-31). BLOCKED means
#                    the provider code exists but has never been run against the live source.
#   start_date / end_date : documented/expected coverage. Observed coverage of cached data
#                    is written by the pipeline to reports/data_quality.md.
#
# Verification note (2026-10-31): the build environment could only reach
# raw.githubusercontent.com and PyPI. Primary documentation was consulted through web
# search result extracts, not by opening the pages; every fact taken that way is marked
# "search extract" and must be re-checked against the page itself before production use.

catalog_version: 1
built_at: "2026-10-31"

series:

# =====================================================================================
# A. PRIMARY / OFFICIAL SOURCES (provider code implemented; BLOCKED in build env)
# =====================================================================================

- id: FRED_TB3MS
  name: 3-Month Treasury Bill Secondary Market Rate, Discount Basis (monthly average)
  provider: FRED (Board of Governors H.15 via St. Louis Fed)
  provider_series_id: TB3MS
  source_url: https://fred.stlouisfed.org/series/TB3MS
  asset_class: money_market_yield
  region: US
  currency: USD
  frequency: monthly (average of daily rates)
  is_total_return: false
  start_date: "1934-01"
  end_date: ongoing
  license_notes: H.15 is US public-domain government data; FRED terms of use apply.
  retrieval_method: HTTPS GET fredgraph.csv (no key)
  proxy_for: US 3-month T-bill total return (after yield->return transformation)
  quality_status: PROXY
  verification: ASSUMPTION
  build_env: BLOCKED
  notes: >-
    A YIELD, not a total-return index. Converted with returns.yield_to_monthly_return
    (r_t = y_{t-1}/1200). Discount basis, monthly average -> documented approximation error.
  fetch: {provider: fred}

