  retrieval_method: HTTPS GET /swea/v1/Observations/{id}/{from}/{to}
  proxy_for: OMRX Treasury Bill Index (synthetic cash model SE_CASH_SSVX_SYNTH_V1)
  quality_status: PROXY
  verification: VERIFIED FROM PRIMARY SOURCE
  build_env: BLOCKED
  notes: >-
    Series id SETB3MBENCH and start 1983-01-03 confirmed on the Riksbank "Series for the API" page
    (search extract, 2026-10-31). A YIELD - never used as a total-return index. Converted by the
    documented cash model SE_CASH_SSVX_SYNTH_V1: month-end yield, r_t = y_{t-1}/1200 (simple, money-
    market convention ASSUMPTION; day-count ACT/360 vs ACT/365 difference ~1.4 % of the rate is
    ignored and documented).
  transform: {model: SE_CASH_SSVX_SYNTH_V1, method: simple_prior, sampling: month_end_last_valid}
  fetch: {provider: riksbank, from: "1983-01-01"}

