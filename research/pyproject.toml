[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-research"
version = "0.1.0"
description = "Research engine for Global Equities Momentum (GEM) and Swedish variants. Research only - no trading."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional: snapshot of Ken French factors bundled in the `arch` package
# (secondary mirror, ends 2018-11). Only used for cross-validation.
mirrors = ["arch>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
